; =============================================================================
; Halal Keeps — PHP settings for InfinityFree / cPanel shared hosting
;
; InfinityFree uses CGI/FastCGI — php_value directives inside .htaccess
; are silently ignored. This .user.ini file is the correct way to override
; PHP settings on FastCGI hosts.
;
; Changes take effect within ~5 minutes (FastCGI process restart cycle).
; Place this file in the same directory as index.php (the project root).
; =============================================================================

; --- Input & upload limits ---------------------------------------------------
max_input_vars          = 3000
upload_max_filesize     = 20M
post_max_size           = 25M
max_file_uploads        = 30
max_input_nesting_level = 64

; --- Memory & execution limits -----------------------------------------------
; InfinityFree caps memory at 256M; stay under to avoid process kills.
memory_limit            = 128M
max_execution_time      = 60
max_input_time          = 60

; --- Error handling (production safe) ----------------------------------------
display_errors          = Off
display_startup_errors  = Off
log_errors              = On
; InfinityFree writes to the account's default error log automatically;
; do NOT set error_log to an absolute path — it will be ignored or cause errors.

; --- Session settings ---------------------------------------------------------
session.cookie_httponly = 1
session.use_strict_mode = 1
; Set to 1 once your SSL certificate is active on InfinityFree
session.cookie_secure   = 0

; --- Character encoding -------------------------------------------------------
default_charset         = "UTF-8"
mbstring.internal_encoding = UTF-8
